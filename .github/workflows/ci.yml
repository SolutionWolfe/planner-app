name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No personal data in the repo (icon.png is the one image allowed)
        run: |
          set -e
          bad=$(git ls-files | grep -Ei '\.(png|jpe?g|heic|gif|webp|mov|mp4)$|^fixtures/|^log/' | grep -vx 'icon.png' || true)
          if [ -n "$bad" ]; then echo "Personal data or media found:"; echo "$bad"; exit 1; fi

      - name: No em dashes
        run: |
          set -e
          if git grep -nI $'\xE2\x80\x94' -- . ':!.github/workflows/ci.yml'; then echo "Em dash found"; exit 1; fi

      - name: Minimal disclosure (no identity, no internal names, no decision references)
        run: |
          set -e
          # Personal names, home folder paths, internal and security vocabulary, health terms, decision and rule references.
          # config.js carries the public project address by design; the gitleaks file needs its own vocabulary.
          words='\bjess\b|jessica|\bwolfe\b|/Users/|allowlist|allowed_signups|confluence|cowork|row.level|\bRLS\b|service_role|SUPABASE_SERVICE_ROLE_KEY|VAPID_PRIVATE_KEY|PLANNER_CRON_SECRET|Personal Planner|wtfbgkyncffvtzacqqng|\bEDS\b|Ehlers|ADHD|hypermobil|labr(al|um)|\bD[0-9]{1,2}\b|\bS-[0-9]+\b|\bR[0-9]\.[0-9]+\b|\bphase [0-9]|Build Plan|\barcher\b'
          if git grep -nIiE "$words" -- . ':!.github/workflows/ci.yml' ':!.gitleaks.toml' ':!config.js'; then echo "A word that must not appear on a public surface was found"; exit 1; fi
          if git grep -nIiE 'jess|wolfe|/Users/|allowlist|confluence' -- config.js; then echo "config.js may hold only public configuration"; exit 1; fi

      - name: Secret scan (gitleaks binary)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # The releases API is rate limited for anonymous calls from shared runners (2026-10-12: it answered
          # without a tag, the tarball URL answered with an error page, and tar failed on "not in gzip format").
          # So: ask with the job token, and fall back to a pinned version when the answer carries no tag.
          ver=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" https://api.github.com/repos/gitleaks/gitleaks/releases/latest | jq -r '.tag_name // empty' || true)
          case "$ver" in v*) ;; *) ver=v8.21.2 ;; esac
          echo "gitleaks ${ver}"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/${ver}/gitleaks_${ver#v}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1

      - name: JavaScript parses
        run: |
          set -e
          for f in app.js rules.js home.js sets.js connect.js checkin.js day.js blocks.js sw.js config.js; do node --check "$f"; done
